<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - My Cafe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <h2 class="logo">Savanna Brew</h2>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main style="padding: 4rem 1rem; max-width: 600px; margin: 0 auto; text-align: center;">
    <h1>Contact & Reserve a Table</h1>
    <p style="margin: 1rem 0;">14 Coffee Lane, Westlands, Nairobi</p>
    <p style="margin-bottom: 2rem;">Phone: +254 700 123 456 | Email: hello@savannabrew.com</p>
    <form style="display: flex; flex-direction: column; gap: 1rem; text-align: left;">
      <input type="text" placeholder="Your Name" style="padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;">
      <input type="email" placeholder="Your Email" style="padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;">
      <textarea rows="4" placeholder="Your Message or Reservation Details" style="padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px;"></textarea>
      <button type="submit" class="btn" style="border: none; cursor: pointer;">Send Message</button>
    </form>
  </main>

  <footer>
    <p class="copyright">&copy; 2026 Savanna Brew Cafe. All rights reserved.</p>
  </footer>
